require_platform:
- Darwin
- Linux
args:
- /home/someone/something
kwargs:
  content: should be this
  line: before this
  before: true
  backup: true
  preserve_meta: false
facts:
  files.Block:
    begin=None, end=None, marker=None, path=/home/someone/something:
    - previously was something else
commands:
- |-
  cp /home/someone/something /home/someone/something.a-timestamp && OUT="$(TMPDIR=_tempdir_ mktemp -t pyinfra.XXXXXX)" &&  awk 'BEGIN {f=0; x=ARGV[2]; ARGV[2]=""; e=ARGV[3]; ARGV[3]=""} /# BEGIN PYINFRA BLOCK/ {n1++; if (f != 0 || n1 > 1) bad=1; f=1; print; next} /# END PYINFRA BLOCK/ {n2++; if (f != 1 || n2 > 1) bad=1; f=0; if (crlf) {gsub(/\n/, "\r\n", x); x=x "\r"} print x; print; next} f == 1 {if (!checked) {checked=1; crlf=(substr($0, length($0)) == "\r")} cur=cur $0 "\n"; next} {print} END {if (bad || f != 0 || n1 != 1 || n2 != 1) {print "pyinfra: invalid block markers in " FILENAME ", not modifying the file" > "/dev/stderr"; exit 1} if (cur != e) {print "pyinfra: block in " FILENAME " changed since this plan was made, not modifying the file" > "/dev/stderr"; exit 1}}' /home/someone/something 'should be this' 'previously was something else
  ' > "$OUT"  && mv "$OUT" /home/someone/something
