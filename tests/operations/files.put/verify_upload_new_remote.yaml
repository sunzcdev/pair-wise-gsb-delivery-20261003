args:
- somefile.txt
- /home/somefile.txt
kwargs:
  mode: 644
  verify_upload: true
local_files:
  files:
    somefile.txt: null
  dirs: {}
facts:
  files.File:
    path=/home/somefile.txt: null
  files.Directory:
    path=/home: true
    path=/home/somefile.txt: null
commands:
- - upload
  - /somefile.txt
  - /home/somefile.txt
- 'test "$( ( sha1sum < /home/somefile.txt 2>/dev/null || shasum < /home/somefile.txt 2>/dev/null || sha1 < /home/somefile.txt 2>/dev/null ) | cut -d '' '' -f 1 )" = ac2cd59a622114712b5b21081763c54bf0caacb8 || test "$( ( md5sum < /home/somefile.txt 2>/dev/null || md5 < /home/somefile.txt 2>/dev/null ) | cut -d '' '' -f 1 )" = c3b126f16dda9ffd0b50f131275d69a9 || test "$( ( sha256sum < /home/somefile.txt 2>/dev/null || shasum -a 256 < /home/somefile.txt 2>/dev/null || sha256 < /home/somefile.txt 2>/dev/null ) | cut -d '' '' -f 1 )" = 2bdc474bf9ce50fa98fe0bc0e3a1d6e8ce591174564a43e6596c4cc072fdef34 || ( echo ''pyinfra: /home/somefile.txt changed after upload, not applying attribute changes'' >&2 ; exit 1 ; ) && chmod 644 /home/somefile.txt'
