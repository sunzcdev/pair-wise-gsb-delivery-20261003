<source>
  @type forward
</source>

<match test>
  @type copy
  # Plugin-wide default for all <store> sections.
  # "no_copy" shares records (read-only for stores), "shallow"/"deep"/"marshal"
  # hand out copies. A <store> can override this with its own "copy_mode".
  copy_mode no_copy
  <store>
    @type stdout
  </store>
  <store>
    @type file
    path /var/log/fluentd/out_file_test
    format json
    buffer_type memory
    # compress gzip
    # symlink_path /path/to/symlink
    append false
    # This store modifies records, so give it its own deep copies.
    copy_mode deep
  </store>
</match>
